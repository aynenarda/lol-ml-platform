<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoL ML Decision Support</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">LoL<span class="brand-accent">ML</span></span>
  </div>
  <p class="brand-subtitle">Kişisel Karar Destek Platformu</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="counters">Counter Pick</button>
  <button class="tab-btn" data-tab="matchup">Matchup Intelligence</button>
</nav>

<main>

  <!-- ===================== MODEL 1: COUNTER PICK ===================== -->
  <section id="tab-counters" class="tab-panel active">
    <div class="card query-card">
      <h2>Rakibe Karşı En İyi Counter'lar</h2>
      <div class="query-row">
        <div class="field">
          <label>Rakip Şampiyon</label>
          <div class="champion-picker" data-target="counters-enemy"></div>
        </div>
        <div class="field">
          <label>Lane</label>
          <div class="lane-picker" data-target="counters-lane"></div>
        </div>
        <button class="primary-btn" id="counters-submit">
          <span>Öner</span>
        </button>
      </div>
    </div>

    <div id="counters-results" class="results-area"></div>
  </section>

  <!-- ===================== MODEL 2: MATCHUP INTELLIGENCE ===================== -->
  <section id="tab-matchup" class="tab-panel">
    <div class="card query-card">
      <h2>Matchup Intelligence: Item, Rün ve Analiz</h2>
      <div class="query-row">
        <div class="field">
          <label>Senin Şampiyonun</label>
          <div class="champion-picker" data-target="matchup-my"></div>
        </div>
        <div class="field">
          <label>Rakip Şampiyon</label>
          <div class="champion-picker" data-target="matchup-enemy"></div>
        </div>
        <div class="field">
          <label>Lane</label>
          <div class="lane-picker" data-target="matchup-lane"></div>
        </div>
        <button class="primary-btn" id="matchup-submit">
          <span>Analiz Et</span>
        </button>
      </div>
    </div>

    <div id="matchup-results" class="results-area"></div>
  </section>

</main>

<footer>
  <p>Tüm tahmin ve öneriler kendi eğitilmiş modellerimizden geliyor - Riot'un hazır build önerileri kullanılmıyor.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
